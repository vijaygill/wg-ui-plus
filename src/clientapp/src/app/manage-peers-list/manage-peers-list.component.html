<table class="data-table" matSort matSortDisableClear matSortActive="name" matSortDirection="asc" (matSortChange)="sortData($event)">
  <thead>
    <tr>
      <th colspan="5">
        <span>
          Add/Edit/Delete Peers here...
        </span>
      </th>
      <th>
        <button mat-flat-button type="button" (click)="newItem();">
          <mat-icon>add</mat-icon>
          New
        </button>
      </th>
    </tr>
    <tr>
      <th mat-sort-header="name">Name</th>
      <th>Description</th>
      <th>IP Address</th>
      <th>Disabled</th>
      <th>Can Access</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    @for (peer of peers; track peer.id) {
      <tr>
        <td>{{ peer.name }}</td>
        <td>{{ peer.description }}</td>
        <td>{{ peer.ip_address }}</td>
        <td>@if (peer.disabled) {
          <mat-icon color="warn" aria-label="Disabled">block</mat-icon>
        }</td>
        <td>{{ peer.target_names }}
        </td>
        <td>
          <button mat-stroked-button type="button" (click)="editItem(peer);">
            <mat-icon>edit</mat-icon>
            Edit
          </button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="6" class="empty-row">No peers found.</td>
      </tr>
    }
  </tbody>
</table>
