<table class="data-table" matSort matSortActive="name" matSortDirection="asc" (matSortChange)="sortData($event)">
  <thead>
    <tr>
      <th colspan="4">
        <span>
          Add/Edit/Delete Peer-Groups here...
        </span>
      </th>
      <th>
        <button mat-flat-button type="button" (click)="newItem();">
          <mat-icon>add</mat-icon>
          New
        </button>
      </th>
    </tr>
    <tr>
      <th mat-sort-header="name">Name</th>
      <th>Description</th>
      <th>Disabled</th>
      <th>Can Access</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    @for (peerGroup of peerGroups; track peerGroup.id) {
      <tr>
        <td>
          {{ peerGroup.name }}
        </td>
        <td>{{ peerGroup.description }}</td>
        <td>@if (peerGroup.disabled) {
          <mat-icon color="warn" aria-label="Disabled">block</mat-icon>
        }</td>
        <td>{{ peerGroup.target_names }}</td>
        <td>
          <button mat-stroked-button type="button" (click)="editItem(peerGroup);">
            <mat-icon>edit</mat-icon>
            Edit
          </button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5" class="empty-row">No peer groups found.</td>
      </tr>
    }
  </tbody>
</table>
