<app-page-header title="Peer Groups"
  subtitle="Peer-Groups are groups of Peers using the VPN."></app-page-header>

<app-crud-container>
    <ng-template #list let-onEdit="onEdit" let-onNewItem="onNewItem">
        <app-manage-peer-groups-list (onEdit)="onEdit($event)"
            (onNewItem)="onNewItem($event)"></app-manage-peer-groups-list>
    </ng-template>
    <ng-template #editor let-onFinish="onFinish" let-getEditItem="getEditItem">
        <app-manage-peer-groups-editor (onFinish)="onFinish($event)"
            [editItem]="getEditItem()"></app-manage-peer-groups-editor>
    </ng-template>
</app-crud-container>
