<div class="login-page">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-content>
      <div class="login-brand">
        <span class="login-monogram" aria-hidden="true">W</span>
        <h1 class="login-title">WireGuard UI Plus</h1>
        <p class="login-subtitle">Run &amp; manage your WireGuard VPN in one UI.</p>
      </div>

      <form #userLogin="ngForm" novalidate (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>User name</mat-label>
          <mat-icon matPrefix>person</mat-icon>
          <input matInput id="username" name="username" [(ngModel)]="credentials.username" autofocus #id="ngModel" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input matInput id="password" name="password" type="password" [(ngModel)]="credentials.password" />
        </mat-form-field>
        <div class="login-actions">
          <button type="submit" mat-flat-button color="primary" class="login-button">Login</button>
        </div>
        @if (userSessionInfo && userSessionInfo.message) {
          <div class="login-message">
            <mat-icon>info</mat-icon>
            <span>{{userSessionInfo.message}}</span>
          </div>
        }
      </form>
    </mat-card-content>
  </mat-card>
</div>
